<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solra</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CLIENT × SOLVER</p>
        <h1>Solra</h1>
        <p class="subtitle">공부를 의뢰처럼 처리하는 게임</p>
      </div>

      <section class="solver-card">
        <p class="solver-label">Solver 상태</p>
        <div class="solver-stats">
          <div class="stat-box">
            <span class="stat-name">레벨</span>
            <strong id="levelText">1</strong>
          </div>
          <div class="stat-box">
            <span class="stat-name">XP</span>
            <strong id="xpText">0</strong>
          </div>
          <div class="stat-box">
            <span class="stat-name">완료 수</span>
            <strong id="completeCountText">0</strong>
          </div>
        </div>
      </section>
    </header>

    <main class="main-grid">
      <section class="panel">
        <h2>오늘의 작업</h2>
        <p class="panel-desc">오늘 처리할 공부를 입력하면 Client 의뢰로 변환됩니다.</p>

        <label for="questInput" class="input-label">작업 입력</label>
        <input
          id="questInput"
          type="text"
          placeholder="예: 수열 3문제 풀기 / 영단어 20개 외우기 / 세계지리 기후 정리하기"
        />

        <div class="button-row">
          <button id="generateBtn" class="primary-btn">의뢰 받기</button>
          <button id="resetBtn" class="ghost-btn" type="button">초기화</button>
        </div>
      </section>

      <section class="panel">
        <h2>현재 의뢰</h2>
        <p class="panel-desc">Client가 보낸 메시지입니다.</p>

        <div id="requestCard" class="message-card empty">
          아직 도착한 의뢰가 없습니다.
        </div>

        <div class="button-row">
          <button id="completeBtn" class="primary-btn" disabled>작업 완료</button>
        </div>
      </section>

      <section class="panel">
        <h2>후기</h2>
        <p class="panel-desc">작업 완료 후 Client 후기가 도착합니다.</p>

        <div id="reviewCard" class="message-card empty">
          아직 후기가 없습니다.
        </div>
      </section>

      <section class="panel">
        <h2>업적</h2>
        <p class="panel-desc">작은 성취를 쌓아 Solver 이력을 만드세요.</p>

        <ul id="achievementList" class="achievement-list">
          <li class="achievement-item locked">아직 해금된 업적이 없습니다.</li>
        </ul>
      </section>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
